name: Deploy niebawem-mcp

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: 51.38.141.16
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /srv/niebawem-mcp
            git pull origin main
            docker compose build --no-cache
            docker compose up -d
            docker compose ps
